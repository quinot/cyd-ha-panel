# =============================================================================
# Windows tab — 5 cover rows
# Row layout (320px wide, 40px tall):
#   x=4   dot (12×12 circle)      x=20  name label (width 78)
#   x=100 position bar (100×10)   x=204 percentage label (width 34)
#   x=240 Open (24×28)            x=267 Stop (24×28)   x=294 Close (24×28)
# =============================================================================
name: "Windows"
id: tab_windows
bg_color: col_bg
border_width: 0
pad_all: 0
pad_top: 5
scrollbar_mode: "off"

widgets:

  # ── Row 1 ────────────────────────────────────────────────────────────────
  - obj:
      id: win1_row
      width: 320
      height: 40
      x: 0
      y: 0
      align: TOP_LEFT
      bg_color: col_card
      radius: 0
      border_width: 0
      pad_all: 0
      widgets:
        - obj:
            id: win1_dot
            width: 12
            height: 12
            radius: 6
            bg_color: col_state_closed
            bg_opa: COVER
            border_width: 0
            align: LEFT_MID
            x: 4
            y: 0
        - label:
            id: win1_label
            text: ${win1_name}
            text_font: font_small
            text_color: col_text
            align: LEFT_MID
            x: 20
            y: 0
            width: 78
            long_mode: CLIP
        - bar:
            id: win1_bar
            width: 100
            height: 10
            align: LEFT_MID
            x: 100
            y: 0
            min_value: 0
            max_value: 100
            value: 0
        - label:
            id: win1_pct
            text: "-%"
            text_font: font_small
            text_color: col_text_dim
            align: LEFT_MID
            x: 204
            y: 0
            width: 34
        - button:
            id: win1_btn_open
            width: 24
            height: 28
            align: LEFT_MID
            x: 240
            y: 0
            bg_color: col_btn_open
            on_click:
              - homeassistant.action:
                  action: cover.open_cover
                  data:
                    entity_id: ${win1_id}
            widgets:
              - label:
                  text: "\U0000e5d8"
                  text_font: font_icons
                  text_color: col_text
                  align: CENTER
        - button:
            id: win1_btn_stop
            width: 24
            height: 28
            align: LEFT_MID
            x: 267
            y: 0
            bg_color: col_btn_stop
            on_click:
              - homeassistant.action:
                  action: cover.stop_cover
                  data:
                    entity_id: ${win1_id}
            widgets:
              - label:
                  text: "\U0000e047"
                  text_font: font_icons
                  text_color: col_text
                  align: CENTER
        - button:
            id: win1_btn_close
            width: 24
            height: 28
            align: LEFT_MID
            x: 294
            y: 0
            bg_color: col_btn_close
            on_click:
              - homeassistant.action:
                  action: cover.close_cover
                  data:
                    entity_id: ${win1_id}
            widgets:
              - label:
                  text: "\U0000e5db"
                  text_font: font_icons
                  text_color: col_text
                  align: CENTER

