text_sensor:

  # ── Window states ─────────────────────────────────────────────────────────

  - platform: homeassistant
    id: win1_state
    entity_id: ${win1_id}
    internal: true
    on_value:
      then:
        - lambda: |-
            lv_color_t c;
            if      (x == "open")    c = lv_color_hex(0x4caf50);
            else if (x == "opening") c = lv_color_hex(0x00b4d8);
            else if (x == "closing") c = lv_color_hex(0xff9800);
            else if (x == "stopped") c = lv_color_hex(0xffeb3b);
            else                     c = lv_color_hex(0x555555);
            lv_obj_set_style_bg_color(id(win1_dot), c, LV_PART_MAIN);

