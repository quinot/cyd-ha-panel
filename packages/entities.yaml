# =============================================================================
# Entities package — Home Assistant sensor imports
#
# Imports cover position (0–100) and cover state for:
#   • 5 roof windows  (win1 … win5)
#   • 5 blinds        (blind1 … blind5)
#
# Entity IDs and display names are all substitutions defined in the
# top-level cyd-ha-panel.yaml, so nothing here needs to change when
# you rename or reassign covers.
#
# State dot colours:
#   open     → green  #4caf50
#   opening  → teal   #00b4d8
#   closing  → orange #ff9800
#   stopped  → yellow #ffeb3b
#   closed   → grey   #555555
# =============================================================================

sensor:

  # ── Window positions ──────────────────────────────────────────────────────

  - platform: homeassistant
    id: win1_pos
    entity_id: ${win1_id}
    attribute: current_position
    internal: true
    on_value:
      then:
        - lvgl.bar.update:
            id: win1_bar
            value: !lambda "return (int)x;"
        - lvgl.label.update:
            id: win1_pct
            text: !lambda |-
              char buf[8];
              snprintf(buf, sizeof(buf), "%d%%", (int)x);
              return std::string(buf);
        - lambda: "cover_update_buttons(id(win1_btn_open), id(win1_btn_close), x);"

