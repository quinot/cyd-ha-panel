# =============================================================================
# Scenes tab — 2×2 grid of 148×85px buttons
# Columns: x=8, x=164  (148px wide, 8px gap, 8px margins)
# Rows:    y=15, y=110  (85px tall, 10px gap, 15px top margin)
#
# Button content (icon + label, or label-only) is built at boot by
# scene_button_init() in packages/scene_buttons.h, called from
# lvgl: on_boot: in ui.yaml. This lets the helper skip the icon label
# entirely when scene_icon is "" rather than needing height workarounds.
# =============================================================================
name: "Scènes"
id: tab_scenes
bg_color: col_bg
border_width: 0
pad_all: 0
scrollbar_mode: "off"

widgets:

  - button:
      id: scene1_btn
      width: 148
      height: 85
      x: 8
      y: 15
      align: TOP_LEFT
      bg_color: col_scene_btn
      radius: 8
      border_color: col_accent
      border_width: 1
      shadow_width: 0
      on_click:
        - homeassistant.action:
            action: scene.turn_on
            data:
              entity_id: ${scene1_id}

  - button:
      id: scene2_btn
      width: 148
      height: 85
      x: 164
      y: 15
      align: TOP_LEFT
      bg_color: col_scene_btn
      radius: 8
      border_color: col_accent
      border_width: 1
      shadow_width: 0
      on_click:
        - homeassistant.action:
            action: scene.turn_on
            data:
              entity_id: ${scene2_id}

  - button:
      id: scene3_btn
      width: 148
      height: 85
      x: 8
      y: 110
      align: TOP_LEFT
      bg_color: col_scene_btn
      radius: 8
      border_color: col_accent
      border_width: 1
      shadow_width: 0
      on_click:
        - homeassistant.action:
            action: scene.turn_on
            data:
              entity_id: ${scene3_id}

  - button:
      id: scene4_btn
      width: 148
      height: 85
      x: 164
      y: 110
      align: TOP_LEFT
      bg_color: col_scene_btn
      radius: 8
      border_color: col_accent
      border_width: 1
      shadow_width: 0
      on_click:
        - homeassistant.action:
            action: scene.turn_on
            data:
              entity_id: ${scene4_id}
