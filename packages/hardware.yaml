# =============================================================================
# Hardware package — ESP32-2432S032C (Cheap Yellow Display v2, capacitive)
#
# Display : ST7789 320×240 IPS TFT via SPI
#   MOSI=GPIO13  CLK=GPIO14  CS=GPIO15  DC=GPIO2  RST=none
#   Backlight PWM on GPIO27
#
# Touch   : GT911 capacitive I2C
#   SDA=GPIO33  SCL=GPIO32  INT=GPIO36  addr=0x5D
#   NOTE: some boards use SDA=21/SCL=22 — swap if touch is unresponsive
#
# RGB LED : active-low (inverted) on GPIO4/16/17
#
# Light   : LDR ambient light sensor on GPIO34 (ADC1_CH6, input-only)
# =============================================================================

# ---------------------------------------------------------------------------
# SPI bus — display only (write-only, MISO omitted)
# ---------------------------------------------------------------------------
spi:
  - id: display_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13

# ---------------------------------------------------------------------------
# I2C bus — GT911 touch controller
# ---------------------------------------------------------------------------
i2c:
  - id: touch_i2c
    sda: GPIO33
    scl: GPIO32
    frequency: 400kHz
    scan: false   # Silence address-scan log spam

# ---------------------------------------------------------------------------
# PWM outputs
# ---------------------------------------------------------------------------
output:
  # Backlight (active-high, 0 % = off, 100 % = full brightness)
  - platform: ledc
    id: backlight_output
    pin: GPIO27
    frequency: 1000Hz

  # RGB status LED (active-low: inverted so 100 % = full on)
  - platform: ledc
    id: led_r
    pin: GPIO4
    inverted: true
  - platform: ledc
    id: led_g
    pin: GPIO16
    inverted: true
  - platform: ledc
    id: led_b
    pin: GPIO17
    inverted: true

# ---------------------------------------------------------------------------
# Lights
# ---------------------------------------------------------------------------
light:
  # Display backlight — exposed to HA so automations can dim it
  - platform: monochromatic
    id: backlight
    name: "CYD Backlight"
    output: backlight_output
    default_transition_length: 300ms
    restore_mode: ALWAYS_ON

  # Onboard RGB LED — useful for status feedback / notifications
  - platform: rgb
    id: status_led
    name: "CYD Status LED"
    red: led_r
    green: led_g
    blue: led_b
    restore_mode: ALWAYS_OFF

# ---------------------------------------------------------------------------
# GT911 capacitive touchscreen
# ---------------------------------------------------------------------------
touchscreen:
  - platform: gt911
    id: touch_panel
    i2c_id: touch_i2c
    address: 0x5D
    # No interrupt pin — driver polls for touch events
    reset_pin: GPIO25
    transform:
      mirror_x: true
      mirror_y: false
      swap_xy: true
    on_release:
      then:
        - if:
            condition:
              lambda: "return id(screensaver_active);"
            then:
              - lambda: |-
                  id(screensaver_active) = false;
                  lv_tabview_set_act(id(main_tabview), id(saved_tab), LV_ANIM_OFF);
              - light.turn_on:
                  id: backlight
                  brightness: 1.0
                  transition_length: 300ms
              - lvgl.page.show: page_main

# ---------------------------------------------------------------------------
# ST7789 display via ili9xxx driver
# ---------------------------------------------------------------------------
display:
  - platform: ili9xxx
    id: main_display
    model: ST7789V
    spi_id: display_spi
    cs_pin: GPIO15
    dc_pin: GPIO2
    # No physical reset pin on this board variant — omit reset_pin entirely
    invert_colors: true   # Required for ST7789V IPS panel
    dimensions:
      width: 320
      height: 240
    transform:
      mirror_x: false
      mirror_y: true
      swap_xy: true
    # LVGL owns all rendering — no lambda block allowed when using LVGL
    auto_clear_enabled: false
    update_interval: never

# ---------------------------------------------------------------------------
# Ambient light sensor — GT36516 photoresistor on GPIO34 (ADC1_CH6, input-only)
# Circuit: 3.3V → R15 (1MΩ) → IO34 → (R19 1MΩ ∥ GT36516) → GND
# GT36516 datasheet: 5–10 kΩ @ 10 lux, 0.3 MΩ in darkness.
# Bright (10 lux): 1M∥5–10k ≈ 5–10 kΩ  → V_IO34 ≈ 16–32 mV
# Dark  (0.3 MΩ):  1M∥300k  ≈ 231 kΩ   → V_IO34 ≈ 0.62 V
# Full range fits within 0 dB (0–0.95 V); gives better resolution than 6 dB.
# ---------------------------------------------------------------------------
sensor:
  - platform: adc
    pin: GPIO34
    name: "CYD Ambient Light"
    attenuation: 0db       # 0–0.95 V range; max dark-state voltage ≈ 0.62 V
    update_interval: 10s
    on_raw_value:
      - lambda: |-
          char buf[16];
          snprintf(buf, sizeof(buf), "LDR: %.2fV", x);
          lv_label_set_text(id(info_ldr), buf);
    filters:
      # Rolling median over 6 samples (60 s) — reported to HA every 10 s
      - median:
          window_size: 6
          send_every: 1

  - platform: wifi_signal
    id: wifi_rssi
    name: "CYD WiFi Signal"
    update_interval: 30s
    on_value:
      - lambda: |-
          int rssi = (int)x;
          const char* bars = rssi > -50 ? "▂▄▆█" :
                             rssi > -65 ? "▂▄▆"  :
                             rssi > -75 ? "▂▄"   :
                             rssi > -85 ? "▂"    : "";
          char buf[48];
          snprintf(buf, sizeof(buf), "Signal: %d dBm %s", rssi, bars);
          lv_label_set_text(id(info_signal), buf);

text_sensor:
  - platform: wifi_info
    ssid:
      id: wifi_ssid
      name: "CYD WiFi SSID"
      on_value:
        - lambda: "update_wifi_label(id(info_ssid), id(wifi_ssid).state, id(wifi_ip).state);"
    ip_address:
      id: wifi_ip
      internal: true
      on_value:
        - lambda: "update_wifi_label(id(info_ssid), id(wifi_ssid).state, id(wifi_ip).state);"
