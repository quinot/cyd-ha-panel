# =============================================================================
# Main page — tabview shell; each tab lives in its own file
# =============================================================================
id: page_main
bg_color: col_bg
widgets:
  - tabview:
      id: main_tabview
      width: 320
      height: 240
      x: 0
      y: 0
      align: TOP_LEFT
      bg_color: col_bg
      border_width: 0
      pad_all: 0
      position: BOTTOM
      size: 30
      tabs:
        - !include ui_main_scenes.yaml
        - !include ui_main_windows.yaml
        - !include ui_main_blinds.yaml
