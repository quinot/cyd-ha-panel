# =============================================================================
# UI package — colours, fonts, LVGL theme/idle trigger, page list
#
# Pages are in separate files to keep indentation manageable:
#   ui_page_main.yaml        — tabview (Windows / Blinds / Scenes)
#   ui_page_screensaver.yaml — drifting clock (burn-in prevention)
# =============================================================================

# ---------------------------------------------------------------------------
# Colour palette
# ---------------------------------------------------------------------------
color:
  - id: col_bg
    hex: "1a1a2e"          # Dark navy — screen background
  - id: col_card
    hex: "16213e"          # Slightly lighter — alternating row tint
  - id: col_accent
    hex: "00b4d8"          # Teal — progress bar fill, borders
  - id: col_text
    hex: "ffffff"          # White — primary text
  - id: col_text_dim
    hex: "9e9e9e"          # Grey — secondary / percentage text
  - id: col_state_closed
    hex: "555555"          # Grey — cover closed / unknown
  - id: col_bar_bg
    hex: "1e4a7a"          # Mid-blue — progress bar track
  - id: col_btn_open
    hex: "1b5e20"          # Dark green — Open button
  - id: col_btn_stop
    hex: "e65100"          # Deep orange — Stop button
  - id: col_btn_close
    hex: "7f0000"          # Dark red — Close button
  - id: col_scene_btn
    hex: "0d3b5e"          # Deep blue — scene card background
  - id: col_tab_active
    hex: "00b4d8"          # Teal — active tab indicator
  - id: col_tab_bar
    hex: "0a0a1a"          # Near-black — tab bar background
  - id: col_black
    hex: "000000"          # Pure black — screensaver background
  - id: col_ss_time
    hex: "e0e0e0"          # Near-white — screensaver clock digits
  - id: col_ss_date
    hex: "c0c0c0"          # Mid-grey — screensaver date line

# ---------------------------------------------------------------------------
# Fonts
# ---------------------------------------------------------------------------
font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 11
    bpp: 4
    extras:
      - file: "gfonts://Roboto"
        glyphs: "àâäéèêëîïôùûüÿçæœÀÂÄÉÈÊËÎÏÔÙÛÜŸÇÆŒ"

  - file: "gfonts://Roboto"
    id: font_medium
    size: 14
    bpp: 4
    extras:
      - file: "gfonts://Roboto"
        glyphs: "àâäéèêëîïôùûüÿçæœÀÂÄÉÈÊËÎÏÔÙÛÜŸÇÆŒ"
      - file: "gfonts://Noto+Sans+Symbols+2"
        glyphs: "▂▄▆█"   # signal strength bars

  - file: "gfonts://Roboto@700"
    id: font_scene
    size: 13
    bpp: 4
    extras:
      - file: "gfonts://Roboto@700"
        glyphs: "àâäéèêëîïôùûüÿçæœÀÂÄÉÈÊËÎÏÔÙÛÜŸÇÆŒ"

  - file: "gfonts://Material+Symbols+Rounded"
    id: font_icons
    size: 16
    bpp: 4
    glyphs:
      - "\U0000e5d8"   # arrow_upward   — Open
      - "\U0000e047"   # stop           — Stop
      - "\U0000e5db"   # arrow_downward — Close

  - file: "gfonts://Roboto"
    id: font_clock
    size: 48
    bpp: 4
    glyphs: "0123456789:- "

  - file: "gfonts://Roboto"
    id: font_clock_date
    size: 16
    bpp: 4
    extras:
      - file: "gfonts://Roboto"
        glyphs: "àâäéèêëîïôùûüÿçæœÀÂÄÉÈÊËÎÏÔÙÛÜŸÇÆŒ"

# ---------------------------------------------------------------------------
# LVGL
# ---------------------------------------------------------------------------
lvgl:
  displays:
    - main_display
  touchscreens:
    - touch_panel

  on_boot:
    - lambda: |-
        lv_obj_add_flag(lv_tabview_get_content(id(main_tabview)),
                        LV_OBJ_FLAG_SCROLL_MOMENTUM);

  theme:
    obj:
      bg_color: col_bg
      bg_opa: COVER
      border_width: 0
      pad_all: 0
    label:
      text_color: col_text
      text_font: font_medium
    button:
      bg_color: col_card
      bg_opa: COVER
      border_width: 0
      radius: 4
      text_color: col_text
      shadow_width: 0
    bar:
      bg_color: col_bar_bg
      bg_opa: COVER
      indicator:
        bg_color: col_accent
        bg_opa: COVER

  pages:
    - !include ui_main.yaml
    - !include ui_screensaver.yaml

  on_idle:
    - timeout: ${screensaver_timeout}s
      then:
        - lambda: |-
            id(saved_tab) = lv_tabview_get_tab_act(id(main_tabview));
            id(screensaver_active) = true;
        - light.turn_on:
            id: backlight
            brightness: ${screensaver_brightness}
            transition_length: 1s
        - lvgl.page.show: page_screensaver
