# =============================================================================
# UI package — LVGL interface, 320×240 landscape, dark navy theme
#
# Layout:
#   Tab bar (30px, bottom): [Windows] [Blinds] [Scenes]
#   Content area (210px):
#     Windows / Blinds tabs: 5 rows × 40px
#       [●dot][name][████░ bar][pct%][▲][■][▼]
#     Scenes tab: 2 × 3 grid of 100×65px scene buttons
#
# Colour tokens   — defined in `color:` section below
# Font tokens     — Roboto (11/14px) + Material Symbols (icons)
# Button colours  — open=dark-green, stop=deep-orange, close=dark-red
# Dot colours     — reflect live HA state via entities.yaml lambdas
# =============================================================================

# ---------------------------------------------------------------------------
# Colour palette
# ---------------------------------------------------------------------------
color:
  - id: col_bg
    hex: "1a1a2e"          # Dark navy — screen background
  - id: col_card
    hex: "16213e"          # Slightly lighter — alternating row tint
  - id: col_accent
    hex: "00b4d8"          # Teal — progress bar fill, borders
  - id: col_text
    hex: "ffffff"          # White — primary text
  - id: col_text_dim
    hex: "9e9e9e"          # Grey — secondary / percentage text
  - id: col_state_closed
    hex: "555555"          # Grey — cover closed / unknown
  - id: col_bar_bg
    hex: "1e4a7a"          # Mid-blue — progress bar track (visible on both row bg colours)
  - id: col_btn_open
    hex: "1b5e20"          # Dark green — Open button
  - id: col_btn_stop
    hex: "e65100"          # Deep orange — Stop button
  - id: col_btn_close
    hex: "7f0000"          # Dark red — Close button
  - id: col_scene_btn
    hex: "0d3b5e"          # Deep blue — scene card background
  - id: col_tab_active
    hex: "00b4d8"          # Teal — active tab indicator
  - id: col_tab_bar
    hex: "0a0a1a"          # Near-black — tab bar background

# ---------------------------------------------------------------------------
# Fonts
# ---------------------------------------------------------------------------
font:
  # Labels — row names, percentages, tab labels
  # extras: adds accented French glyphs (ESPHome only embeds explicitly listed chars)
  - file: "gfonts://Roboto"
    id: font_small
    size: 11
    bpp: 4
    extras:
      - file: "gfonts://Roboto"
        glyphs: "àâäéèêëîïôùûüÿçæœÀÂÄÉÈÊËÎÏÔÙÛÜŸÇÆŒ"

  - file: "gfonts://Roboto"
    id: font_medium
    size: 14
    bpp: 4
    extras:
      - file: "gfonts://Roboto"
        glyphs: "àâäéèêëîïôùûüÿçæœÀÂÄÉÈÊËÎÏÔÙÛÜŸÇÆŒ"

  # Scene button text
  - file: "gfonts://Roboto@700"
    id: font_scene
    size: 13
    bpp: 4
    extras:
      - file: "gfonts://Roboto@700"
        glyphs: "àâäéèêëîïôùûüÿçæœÀÂÄÉÈÊËÎÏÔÙÛÜŸÇÆŒ"

  # Control button icons — only the 3 glyphs we need (saves flash)
  - file: "gfonts://Material+Symbols+Rounded"
    id: font_icons
    size: 16
    bpp: 4
    glyphs:
      - "\U0000e5d8"   # arrow_upward   — Open  (solid arrow up)
      - "\U0000e047"   # stop           — Stop  (■)
      - "\U0000e5db"   # arrow_downward — Close (solid arrow down)

# ---------------------------------------------------------------------------
# LVGL configuration
# ---------------------------------------------------------------------------
lvgl:
  displays:
    - main_display
  touchscreens:
    - touch_panel

  # Enable scroll momentum on the tabview content so a short fast swipe
  # carries through and switches tabs without needing a full-width drag.
  on_boot:
    - lambda: |-
        lv_obj_add_flag(lv_tabview_get_content(id(main_tabview)),
                        LV_OBJ_FLAG_SCROLL_MOMENTUM);

  # ── Global theme defaults ─────────────────────────────────────────────────
  theme:
    obj:
      bg_color: col_bg
      bg_opa: COVER
      border_width: 0
      pad_all: 0
    label:
      text_color: col_text
      text_font: font_medium
    button:
      bg_color: col_card
      bg_opa: COVER
      border_width: 0
      radius: 4
      text_color: col_text
      shadow_width: 0
    bar:
      bg_color: col_bar_bg
      bg_opa: COVER
      indicator:
        bg_color: col_accent
        bg_opa: COVER

  # ── Root widget — full-screen tabview ─────────────────────────────────────
  widgets:
    - tabview:
        id: main_tabview
        width: 320
        height: 240
        x: 0
        y: 0
        align: TOP_LEFT
        bg_color: col_bg
        border_width: 0
        pad_all: 0
        position: BOTTOM
        size: 30

        tabs:

          # ================================================================
          # TAB 1 — WINDOWS
          # 5 rows stacked vertically; alternating col_card / col_bg rows
          # Row layout (320px wide, 40px tall):
          #   x=4   dot (12×12 circle)
          #   x=20  name label (width 78)
          #   x=100 position bar (100×10)
          #   x=204 percentage label (width 34)
          #   x=240 Open button  (26×28)
          #   x=269 Stop button  (26×28)
          #   x=291 Close button (26×28)
          # ================================================================
          - name: "Windows"
            id: tab_windows
            bg_color: col_bg
            border_width: 0
            pad_all: 0
            pad_top: 5
            scrollbar_mode: "off"

            widgets:

              # ── Row 1 ────────────────────────────────────────────────────
              - obj:
                  id: win1_row
                  width: 320
                  height: 40
                  x: 0
                  y: 0
                  align: TOP_LEFT
                  bg_color: col_card
                  radius: 0
                  border_width: 0
                  pad_all: 0
                  widgets:
                    - obj:
                        id: win1_dot
                        width: 12
                        height: 12
                        radius: 6
                        bg_color: col_state_closed
                        bg_opa: COVER
                        border_width: 0
                        align: LEFT_MID
                        x: 4
                        y: 0
                    - label:
                        id: win1_label
                        text: ${win1_name}
                        text_font: font_small
                        text_color: col_text
                        align: LEFT_MID
                        x: 20
                        y: 0
                        width: 78
                        long_mode: CLIP
                    - bar:
                        id: win1_bar
                        width: 100
                        height: 10
                        align: LEFT_MID
                        x: 100
                        y: 0
                        min_value: 0
                        max_value: 100
                        value: 0
                    - label:
                        id: win1_pct
                        text: "-%"
                        text_font: font_small
                        text_color: col_text_dim
                        align: LEFT_MID
                        x: 204
                        y: 0
                        width: 34
                    - button:
                        id: win1_btn_open
                        width: 24
                        height: 28
                        align: LEFT_MID
                        x: 240
                        y: 0
                        bg_color: col_btn_open
                        on_click:
                          - homeassistant.action:
                              action: cover.open_cover
                              data:
                                entity_id: ${win1_id}
                        widgets:
                          - label:
                              text: "\U0000e5d8"
                              text_font: font_icons
                              text_color: col_text
                              align: CENTER
                    - button:
                        id: win1_btn_stop
                        width: 24
                        height: 28
                        align: LEFT_MID
                        x: 267
                        y: 0
                        bg_color: col_btn_stop
                        on_click:
